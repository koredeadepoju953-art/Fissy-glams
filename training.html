<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Makeup and gele training | Tissy Glams Studio</title>
<meta name="description" content="Makeup classes, gele workshops and a professional masterclass with Tissy Glams Studio.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="training">
<div id="site-header"></div>
<main>
<div class="page-hero"><div class="wrap"><h1>Makeup and gele training</h1><p class="lead">Hands-on classes in small groups, so you get real practice and personal feedback.</p></div></div>
<section><div class="wrap"><div id="courses"></div></div></section>
<section class="tint" id="enquire"><div class="wrap" style="max-width:820px">
  <div class="sec-head"><h2>Ask about a class</h2><p class="lead">Tell us which class you want. Tissy replies on WhatsApp with start dates and how to reserve your seat.</p></div>
  <form id="train-form" class="form-card" novalidate><div class="form-grid">
    <div class="field full"><label for="course">Class</label><select id="course" required></select><p class="err-msg">Choose a class.</p></div>
    <div class="field"><label for="tname">Your name</label><input id="tname" type="text" autocomplete="name" required><p class="err-msg">Enter your name.</p></div>
    <div class="field"><label for="tphone">Phone number</label><input id="tphone" type="tel" autocomplete="tel" required><p class="err-msg">Enter a valid phone number.</p></div>
    <div class="field full"><label for="level">Your experience</label><select id="level"><option>Complete beginner</option><option>I do makeup for friends</option><option>I already work as a makeup artist</option></select></div>
    <div class="field full"><label for="tmsg">Message (optional)</label><textarea id="tmsg"></textarea></div>
  </div><div class="btn-row"><button class="btn wa" type="submit">Send enquiry on WhatsApp</button></div></form>
  <div id="train-result"></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
