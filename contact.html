<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Fissy Glam Studio</title>
<meta name="description" content="Contact Fissy Glam Studio on WhatsApp or Instagram.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
<div id="site-header"></div>
<main>
<div class="page-hero"><div class="wrap"><h1>Contact</h1><p class="lead">The fastest way to reach Fissy is WhatsApp.</p></div></div>
<section><div class="wrap split" style="align-items:start">
  <div>
    <h2 style="font-size:1.8rem">Studio details</h2>
    <p style="margin-top:14px"><strong>Location</strong><br><span id="c-addr"></span></p>
    <p style="margin-top:14px"><strong>Hours</strong><br><span id="c-hours"></span></p>
    <p style="margin-top:14px"><strong>WhatsApp</strong><br><a id="c-wa" target="_blank" rel="noopener"></a></p>
    <p style="margin-top:14px"><strong>Instagram</strong><br><a id="c-ig" target="_blank" rel="noopener"></a></p>
  </div>
  <div><form id="contact-form" class="form-card" novalidate><div class="form-grid">
    <div class="field"><label for="cname">Your name</label><input id="cname" type="text" autocomplete="name" required><p class="err-msg">Enter your name.</p></div>
    <div class="field"><label for="cphone">Phone number</label><input id="cphone" type="tel" autocomplete="tel" required><p class="err-msg">Enter a valid phone number.</p></div>
    <div class="field full"><label for="cmsg">Message</label><textarea id="cmsg" required></textarea><p class="err-msg">Write your message.</p></div>
  </div><div class="btn-row"><button class="btn wa" type="submit">Send on WhatsApp</button></div></form><div id="contact-result"></div></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
